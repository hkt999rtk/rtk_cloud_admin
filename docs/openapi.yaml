                  action: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  member: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/PlainTextError" }
        "401": { $ref: "#/components/responses/PlainTextError" }
        "403": { $ref: "#/components/responses/PlainTextError" }
        "502": { $ref: "#/components/responses/PlainTextError" }

  /api/admin/brand-clouds/{brandCloudId}/users/{userId}:
    delete:
      operationId: deleteApiAdminBrandCloudUserMembership
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-004
      tags: [Platform Admin, Brand Clouds]
      summary: Soft-delete a global user's Brand Cloud membership
      parameters:
        - $ref: "#/components/parameters/BrandCloudID"
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Membership access removed. }
        "401": { $ref: "#/components/responses/PlainTextError" }
        "403": { $ref: "#/components/responses/PlainTextError" }
        "502": { $ref: "#/components/responses/PlainTextError" }

  /api/admin/brand-clouds/{brandCloudId}/users/{userId}/{action}:
    post:
      operationId: postApiAdminBrandCloudUserMembershipAction
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-004
      tags: [Platform Admin, Brand Clouds]
      summary: Enable or disable a global user's Brand Cloud membership
      parameters:
        - $ref: "#/components/parameters/BrandCloudID"
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [enable, disable] } }
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/PlainTextError" }
        "403": { $ref: "#/components/responses/PlainTextError" }
        "502": { $ref: "#/components/responses/PlainTextError" }

  /api/admin/sso/providers:
    get:
      operationId: getApiAdminSsoProviders
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      tags: [Platform Admin, SSO]
      summary: List SSO provider status for platform-visible organizations
      responses:
        "200":
          description: SSO provider status list.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SSOProviderStatus"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/admin/orgs/{orgId}/sso-provider:
    get:
      operationId: getApiAdminOrgsByOrgIdSsoProvider
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      tags: [Platform Admin, SSO]
      summary: Get SSO provider configuration status for an organization
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: SSO provider status.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider:
                    $ref: "#/components/schemas/SSOProviderStatus"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"
    put:
      operationId: putApiAdminOrgsByOrgIdSsoProvider
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      tags: [Platform Admin, SSO]
      summary: Upsert SSO provider configuration for an organization
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOProviderConfigRequest"
      responses:
        "200":
          description: SSO provider configuration updated.
          content:
            application/json:
              schema:
                type: object
                required: [provider]
                properties:
                  provider:
                    $ref: "#/components/schemas/SSOProviderStatus"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rtk_admin_session

  parameters:
    BillingDisplayedOwnershipVersion:
      name: X-Cloud-Ownership-Version
      in: header
      required: true
      description: Displayed ownership version; compared against live Account Manager evidence before a write. Never forwarded as trusted Billing authority.
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    ManagedCloudIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One stable key per write intent; retry unchanged requests with the same key. Duplicate headers rejected.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client key used to safely replay a write request.
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted automatic top-up policy version used for optimistic concurrency.
      schema: { type: string, pattern: '^"?[0-9]+"?$' }
    DeviceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: dev-001
    OrgID:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      example: org-acme
    BrandCloudID:
      name: brandCloudId
      in: path
      required: true
      schema:
        type: string
      example: brand-1
    FleetWindow:
      name: window
      in: query
      required: false
      schema:
        type: string
        enum: [7d, 30d, 90d]
        default: 7d
    Code:
      name: code
      in: query
      required: true
      schema:
        type: string
    State:
      name: state
      in: query
      required: true
      schema:
        type: string
    ProviderID:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChipsetID:
      name: chipsetId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ManagedCloudError:
      description: Authentication (401), authorization (403), missing scope (404), conflict (409), invalid input (400/422), quota/rate limit (429), unavailable dependency (503), or malformed upstream result (502). Upstream diagnostics are never exposed. Responses are no-store; 401 invalidates the local session.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
        text/plain:
          schema: { type: string }
    PlainTextError:
      description: Plain text error response.
      content:
        text/plain:
          schema:
            type: string
            example: authentication required
    PaymentError:
      description: Stable customer-safe payment error without provider payloads or references.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PaymentError" }

  schemas:
    DeveloperPKIAppBundleRequest:
      type: object
      additionalProperties: false
      required: [brand_cloud_id, target_type, target_id, csr_pem]
      properties:
        brand_cloud_id: { type: string }
        target_type: { type: string, enum: [user, end_user] }
        target_id: { type: string }
        csr_pem:
          type: string
          description: P-256 PKCS#10 CSR. A private key must never be sent.
    DeveloperPKIDeviceBundleRequest:
      type: object
      additionalProperties: false
      required: [brand_cloud_id, device_item_profile_id, device_id, serial_number, csr_pem]
      properties:
        brand_cloud_id: { type: string }
        device_item_profile_id: { type: string }
        device_id: { type: string }
        serial_number: { type: string }
        csr_pem:
          type: string
          description: P-256 PKCS#10 CSR. A private key must never be sent.
    RTKCertificateBundleV1:
      type: object
      additionalProperties: false
      description: |
        Shared certificate representation. `test_exportable` is only for simple
        local/staging SDK tests and is never a production identity.
      required: [format, version, profile, environment, usage, tenant_id, identity, key, certificate, issuance]
      properties:
        format: { type: string, enum: [rtk_certificate_bundle] }
        version: { type: integer, enum: [1] }
        profile: { type: string, enum: [certificate_only, test_exportable] }
        environment: { type: string, enum: [local, staging, production] }
        usage: { type: string, enum: [device_mtls, app_mtls] }
        tenant_id: { type: string }
        identity:
          type: object
          required: [kind, id, subject_dn, uri_sans]
          properties:
            kind: { type: string, enum: [device, app] }
            id: { type: string }
            subject_dn: { type: string }
            uri_sans: { type: array, items: { type: string, format: uri } }
        key:
          type: object
          required: [algorithm, spki_sha256, material]
          properties:
            algorithm: { type: string, enum: [ecdsa_p256, ed25519, rsa_2048] }
            spki_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            material:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [caller_managed, key_reference, embedded_pkcs8_pem] }
                provider: { type: string }
                reference: { type: string }
                private_key_pem:
                  type: string
                  description: Unencrypted PKCS#8; legal only for test_exportable in local/staging.
        certificate:
          type: object
          required: [chain_pem, serial_number_hex, fingerprint_sha256, not_before, not_after]
          properties:
            chain_pem: { type: array, minItems: 1, items: { type: string } }
            serial_number_hex: { type: string, pattern: "^(?:[0-9a-f]{2})+$" }
            fingerprint_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            not_before: { type: string, format: date-time }
            not_after: { type: string, format: date-time }
        issuance:
          type: object
          required: [request_id, issued_at]
          properties:
            request_id: { type: string }
            issued_at: { type: string, format: date-time }
    PaymentError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    BillingAccount:
      type: object
      additionalProperties: false
      required: [id, organization_id, currency, available_balance_minor, state, version, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        currency: { type: string, enum: [TWD] }
        available_balance_minor: { type: integer, format: int64 }
        state: { type: string, enum: [active, attention_required, suspended, closed] }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BillingAccountResponse:
      type: object
      additionalProperties: false
      required: [account, auto_topup]
      properties:
        account: { $ref: "#/components/schemas/BillingAccount" }
        auto_topup:
          allOf: [{ $ref: "#/components/schemas/AutoTopUpPolicy" }]
          nullable: true
    BillingLedgerEntry:
      type: object
      additionalProperties: false
      required: [id, direction, amount_minor, currency, reason, balance_after_minor, created_at]
      properties:
        id: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [TWD] }
        reason: { type: string }
        balance_after_minor: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    BillingPagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    BillingLedgerResponse:
      type: object
      additionalProperties: false
      required: [ledger_entries, pagination]
      properties:
        ledger_entries: { type: array, items: { $ref: "#/components/schemas/BillingLedgerEntry" } }
        pagination: { $ref: "#/components/schemas/BillingPagination" }
    PaymentCapabilities:
      type: object
      additionalProperties: false
      required: [hosted_setup, merchant_initiated_charge, query, webhook, refund]
      properties:
        hosted_setup: { type: boolean }
        merchant_initiated_charge: { type: boolean }
        query: { type: boolean }
        webhook: { type: boolean }
        refund: { type: boolean }
    PaymentMethod:
      type: object
      additionalProperties: false
      required: [id, provider, status, capabilities, created_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string }
        status: { type: string, enum: [pending, active, revoked, expired, failed] }
        card_brand: { type: string }
        last_four: { type: string, pattern: '^[0-9]{4}$' }
        expiry_month: { type: integer, minimum: 1, maximum: 12 }
        expiry_year: { type: integer, minimum: 2026 }
        capabilities: { $ref: "#/components/schemas/PaymentCapabilities" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaymentMethodsResponse:
      type: object
      additionalProperties: false
      required: [payment_methods, pagination]
      properties:
        payment_methods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
        pagination: { $ref: "#/components/schemas/BillingPagination" }
    AutoTopUpPolicy:
      type: object
      additionalProperties: false
      required: [id, enabled, threshold_minor, top_up_amount_minor, currency, payment_method_id, daily_attempt_limit, daily_amount_limit_minor, cooldown_seconds, generation, version, armed, limit_timezone, limit_reset_at, created_at, updated_at]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        threshold_minor: { type: integer, format: int64, minimum: 1 }
        top_up_amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [TWD] }
        payment_method_id: { type: string }
        daily_attempt_limit: { type: integer, minimum: 1, maximum: 10 }
        daily_amount_limit_minor: { type: integer, format: int64, minimum: 1 }
        cooldown_seconds: { type: integer, format: int64, minimum: 300 }
        generation: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        armed: { type: boolean }
        last_triggered_at: { type: string, format: date-time }
        last_succeeded_at: { type: string, format: date-time }
        limit_timezone: { type: string, enum: [UTC] }
        limit_reset_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AutoTopUpResponse:
      type: object
      additionalProperties: false
      required: [auto_topup]
      properties:
        auto_topup:
          allOf: [{ $ref: "#/components/schemas/AutoTopUpPolicy" }]
          nullable: true
    AutoTopUpRequest:
      type: object
      additionalProperties: false
      required: [enabled, threshold_minor, top_up_amount_minor, currency, payment_method_id, daily_attempt_limit, daily_amount_limit_minor, cooldown_seconds, consent]
      properties:
        enabled: { type: boolean }
        threshold_minor: { type: integer, format: int64, minimum: 1 }
        top_up_amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [TWD] }
        payment_method_id: { type: string }
        daily_attempt_limit: { type: integer, minimum: 1, maximum: 10 }
        daily_amount_limit_minor: { type: integer, format: int64, minimum: 1 }
        cooldown_seconds: { type: integer, format: int64, minimum: 300 }
        consent:
          type: object
          additionalProperties: false
          required: [accepted, text_version, text_sha256, locale]
          properties:
            accepted: { type: boolean, enum: [true] }
            text_version: { type: string }
            text_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            locale: { type: string }
    PaymentIntent:
      type: object
      additionalProperties: false
      required: [id, amount_minor, currency, reason, provider, payment_method_id, state, requires_customer_action, correlation_id, created_at, updated_at]
      properties:
        id: { type: string }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [TWD] }
        reason: { type: string, enum: [manual_top_up, auto_top_up] }
        provider: { type: string }
        payment_method_id: { type: string }
        state: { type: string, enum: [created, processing, authorized, requires_action, unknown, succeeded, failed, canceled] }
        requires_customer_action: { type: boolean }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    PaymentIntentsResponse:
      type: object
      additionalProperties: false
      required: [payment_intents, pagination]
      properties:
        payment_intents: { type: array, items: { $ref: "#/components/schemas/PaymentIntent" } }
        pagination: { $ref: "#/components/schemas/BillingPagination" }
    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    StatusAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 8
    SignupRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    SignupResult:
      type: object
      required: [user, organization]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
    AuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    VerifyEmailRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false
    VerifyEmailResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"
        kind:
          type: string
          enum: [customer, platform_admin]
          description: Selected account view; present when activation creates a session.
    AuthSessionResult:
      type: object
      required: [status, kind]
      properties:
        status:
          type: string
          enum: [ok]
        kind:
          type: string
          enum: [customer, platform_admin]
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    SSOStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        return_url:
          type: string
          format: uri-reference
    SSOStartResult:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
        state:
          type: string
        provider_id:
          type: string
        organization_id:
          type: string
        organization:
          type: string
    ActiveOrgRequest:
      type: object
      required: [organization_id]
      properties:
        organization_id:
          type: string
    ActiveOrgResponse:
      type: object
      required: [active_org_id]
      properties:
        active_org_id:
          type: string
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        organization_kind:
          type: string
        status:
          type: string
        tier:
          type: string
        evaluation_device_quota:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        platform_capabilities:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
    Membership:
      type: object
      required: [organization_id, organization, role]
      properties:
        organization_id:
          type: string
        organization:
          type: string
        role:
          type: string
        tier:
          type: string
        evaluation_device_quota:
          type: integer
        capabilities:
          type: array
          items:
            type: string
    Me:
      type: object
      required:
        - user_id
        - email
        - name
        - kind
        - memberships
        - active_org_id
        - demo_mode
        - authenticated
        - customer_password_login_enabled
      properties:
        user_id:
          type: string
        email:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [demo, customer, platform_admin]
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        active_org_id:
          type: string
        demo_mode:
          type: boolean
        authenticated:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        customer_password_login_enabled:
          type: boolean
    Summary:
      type: object
      required:
        - total_devices
        - online_devices
        - activated_devices
        - pending_devices
        - failed_devices
        - open_operations
        - customers
      properties:
        total_devices:
          type: integer
        online_devices:
          type: integer
        activated_devices:
          type: integer
        pending_devices:
          type: integer
        failed_devices:
          type: integer
        open_operations:
          type: integer
        customers:
          type: integer
    CustomerSummary:
      type: object
      required:
        - organization_id
        - organization
        - total_devices
        - online_devices
        - activated_devices
        - pending_devices
        - failed_devices
        - last_seen_at
      properties:
        organization_id:
          type: string
        organization:
          type: string
        total_devices:
          type: integer
        online_devices:
          type: integer
        activated_devices:
          type: integer
        pending_devices:
          type: integer
        failed_devices:
          type: integer
        last_seen_at:
          type: string
          format: date-time
    ReadinessState:
      type: string
      enum:
        - registered
        - claim_pending
        - local_onboarding_pending
        - cloud_activation_pending
        - activated
        - online
        - failed
        - deactivation_pending
        - deactivated
    OperationState:
