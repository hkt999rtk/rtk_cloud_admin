openapi: 3.0.3
x-rtk-spec:
  id: SPEC-CA-OPENAPI
  status: normative
  owner: rtk_cloud_admin
info:
  title: RTK Cloud Admin BFF API
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    HTTP API exposed by `rtk_cloud_admin` for the Admin Console web UI.

    This service is a BFF. Account Manager remains authoritative for identity,
    organizations, membership, brand-cloud records, registry devices, quota
    requests, and SSO provider configuration. Video Cloud remains authoritative
    for activation, telemetry, firmware, and streaming facts. Admin Console
    stores local sessions, audit metadata, and demo
    projections.

    All JSON endpoints may return `text/plain` error responses from Go
    `http.Error` for validation, authorization, and upstream failures.
servers:
  - url: /
    description: Same-origin Admin Console server
tags:
  - name: Health
    description: Process and upstream health checks.
  - name: Auth
    description: Login, logout, signup, verification, and SSO session creation.
  - name: Session
    description: Current user and active organization state.
  - name: Customer
    description: Customer-scoped organization and account workflows.
  - name: Platform Admin
    description: Platform-admin protected operations.
  - name: Devices
    description: Device inventory, detail, telemetry, and lifecycle actions.
  - name: Fleet
    description: Customer fleet health, stream, firmware, and telemetry projections.
  - name: Operations
    description: Provisioning and deactivation lifecycle operations.
  - name: Audit
    description: Audit event views.
  - name: Brand Clouds
    description: Account Manager-backed brand-cloud administration.
  - name: Developer
    description: Global developer session and active Brand Cloud management.
  - name: ChipSet SDK
    description: Account Manager-backed ChipSet and SDK provider administration and developer resources.
  - name: SSO
    description: Account Manager-backed OIDC SSO configuration and flows.
  - name: Billing
    description: Active-organization commercial balance and provider-safe payment workflows.
security:
  - SessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      x-rtk-feature-id: FEAT-CA-OBS-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-DASH-002
      tags: [Health]
      summary: Process health check
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /api/auth/customer/signup:
    post:
      operationId: postApiAuthCustomerSignup
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Start customer self-service signup
      description: Proxies signup to Account Manager. Requires `ACCOUNT_MANAGER_BASE_URL`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Signup accepted; Account Manager created a pending user and organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResult"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/login:
    post:
      operationId: postApiAuthLogin
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Global human account login
      description: Authenticates one global user, loads memberships and platform capabilities once, and creates a shared account session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded and set `rtk_admin_session`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only `rtk_admin_session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/customer/verify-email:
    post:
      operationId: postApiAuthCustomerVerifyEmail
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Verify a customer signup email and set its initial password
      description: Proxies the callback token and new password to Account Manager. When tokens are returned, resolves global /v1/me before creating a unified account session, selects the first membership as the active Brand Cloud, and returns the selected view kind (membership first, otherwise platform capability). Accounts without either receive 403 without a session cookie. The Web UI consumes the opaque token from the callback URL without rendering it or exposing an editable token field and routes to the selected account view.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Verification succeeded.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only `rtk_admin_session` cookie when Account Manager returns tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResult"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/customer/resend-verification:
    post:
      operationId: postApiAuthCustomerResendVerification
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Resend customer email verification
      description: Proxies resend request to Account Manager.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Resend accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusAccepted"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/sign-in:
    post:
      operationId: postApiAuthSignIn
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Request an email sign-in activation token
      description: Proxies to Account Manager and always returns `202 Accepted` for syntactically valid email requests, including unknown, disabled, and rate-limited accounts. Token delivery is handled by Account Manager's configured server-side sink.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Sign-in request accepted when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusAccepted"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/login/activate:
    post:
      operationId: postApiAuthLoginActivate
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Activate an email sign-in token
      description: Proxies login activation to Account Manager and sets `rtk_admin_session` only after the one-time token succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Login activation succeeded and set `rtk_admin_session`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only `rtk_admin_session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResult"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/forgot-password:
    post:
      operationId: postApiAuthForgotPassword
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Request an email password-reset activation token
      description: Proxies to Account Manager and always returns `202 Accepted` for syntactically valid email requests, including unknown, disabled, and rate-limited accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Password reset request accepted when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusAccepted"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/reset-password:
    post:
      operationId: postApiAuthResetPassword
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth]
      summary: Reset a password with an email activation token
      description: Proxies reset token consumption to Account Manager. Account Manager revokes existing refresh tokens after a successful password reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset succeeded.
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/sso/start:
    post:
      operationId: postApiAuthSsoStart
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      tags: [SSO, Auth]
      summary: Start Account Manager-backed SSO
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOStartRequest"
      responses:
        "200":
          description: SSO provider was resolved and a redirect URL was returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStartResult"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/sso/callback:
    get:
      operationId: getApiAuthSsoCallback
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      tags: [SSO, Auth]
      summary: Complete Account Manager-backed SSO
      description: Exchanges `code` and `state`, creates a local session, then redirects to `/console` or `/admin`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/State"
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Session created; browser redirected to the console.
          headers:
            Location:
              schema:
                type: string
                enum: [/console, /admin]
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only `rtk_admin_session` cookie.
        "400":
          $ref: "#/components/responses/PlainTextError"
        "502":
          $ref: "#/components/responses/PlainTextError"
        "503":
          $ref: "#/components/responses/PlainTextError"

  /api/auth/logout:
    post:
      operationId: postApiAuthLogout
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Auth, Session]
      summary: Delete the local Admin Console session
      responses:
        "200":
          description: Session row was deleted if present and cookie was cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired `rtk_admin_session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"

  /api/me:
    get:
      operationId: getApiMe
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      tags: [Session]
      summary: Current user, memberships, active organization, and auth settings
      description: Returns demo identity when no session exists.
      security:
        - SessionCookie: []
        - {}
      responses:
        "200":
          description: Current identity and console capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "502":
          $ref: "#/components/responses/PlainTextError"

  /api/me/active-org:
    post:
      operationId: postApiMeActiveOrg
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-SCOPE-001
      tags: [Session, Customer]
      summary: Switch active customer organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveOrgRequest"
      responses:
        "200":
          description: Active organization was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveOrgResponse"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
        "403":
          $ref: "#/components/responses/PlainTextError"

  /api/me/view:
    post:
      operationId: postApiMeView
      x-rtk-feature-id: FEAT-CA-BFF-001
      x-rtk-requirement-ids:
        - REQ-CA-BFF-LOGIN-001
      tags: [Session]
      summary: Switch between Customer and Platform views in the same account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [view]
              properties:
                view: { type: string, enum: [customer, platform] }
      responses:
        "200":
          description: Session view updated without reauthentication.
          content:
            application/json:
              schema:
                type: object
                required: [status, kind]
                properties:
                  status: { type: string, enum: [ok] }
                  kind: { type: string, enum: [customer, platform_admin] }
        "400": { $ref: "#/components/responses/PlainTextError" }
        "401": { $ref: "#/components/responses/PlainTextError" }
        "403": { $ref: "#/components/responses/PlainTextError" }

  /api/developer/brand-clouds:
    get:
      operationId: getApiDeveloperBrandClouds
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: List Brand Clouds available to the signed-in developer
      description: Global account session; never reads or changes active organization. Quota counts owned clouds independently of the selected view. Responses are not cached.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [all, owned, shared], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Developer Brand Cloud memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperBrandCloudList"
        "401": { $ref: "#/components/responses/PlainTextError" }

    post:
      operationId: postApiDeveloperBrandClouds
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Create a cloud and its sole owner membership
      description: Requires global account authentication, upstream eligibility and ownership quota; no existing membership required. Same-origin cookie-authenticated writes only.
      parameters:
        - $ref: '#/components/parameters/ManagedCloudIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ManagedCloudWrite'
                - required: [name]
      responses:
        '201':
          description: Created cloud, or replay of the same creation intent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeveloperBrandCloudDetail' }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}:
    get:
      operationId: getApiDeveloperBrandCloudsByBrandCloudID
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Get one Brand Cloud and the current membership
      parameters:
        - { name: brandCloudID, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Brand Cloud detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperBrandCloudDetail"
        "401": { $ref: "#/components/responses/PlainTextError" }
        "403": { $ref: "#/components/responses/PlainTextError" }

    patch:
      operationId: patchApiDeveloperBrandCloudsByBrandCloudID
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Owner updates name or description without changing UUID or tenant slug
      parameters:
        - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ManagedCloudIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedCloudWrite' }
      responses:
        '200':
          description: Updated cloud.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeveloperBrandCloudDetail' }
        default: { $ref: '#/components/responses/ManagedCloudError' }
    delete:
      operationId: deleteApiDeveloperBrandCloudsByBrandCloudID
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Request tracked soft deletion after rechecking emptiness and zero balance
      description: Owner only; request body prohibited. Acceptance is not completion. Historical audit and Billing records remain. Transfer eligibility (balance >= 0) does not imply deletion eligibility (balance = 0).
      parameters:
        - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ManagedCloudIdempotencyKey'
      responses:
        '202':
          description: Durable operation accepted or replayed.
          headers:
            Location: { description: Same-origin BFF operation resource, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedCloudOperationResult' }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}/deletion-preflight:
    get:
      operationId: getApiDeveloperBrandCloudsByBrandCloudIDDeletionPreflight
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Read current deletion blockers without authorizing a future deletion
      parameters:
        - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Live eligibility and actionable blockers.
          content:
            application/json:
              schema:
                type: object
                required: [eligible]
                properties:
                  eligible: { type: boolean }
                  blockers: { type: array, items: { $ref: '#/components/schemas/ManagedCloudBlocker' } }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}/operations/{operationID}:
    get:
      operationId: getApiDeveloperBrandCloudsByBrandCloudIDOperationsByOperationID
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ROLE-001
      tags: [Developer]
      summary: Poll a scope-validated durable cloud operation including after deletion
      parameters:
        - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: operationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Authorized operation status, not a cached active-cloud snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedCloudOperationResult' }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}/fleet/summary:
    parameters:
      - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getScopedBrandCloudFleetSummary
      x-rtk-feature-id: FEAT-CA-PROV-001
      x-rtk-requirement-ids: [REQ-UI-CA-FLEETPAGE-001]
      tags: [Developer, Fleet]
      summary: Read fleet aggregates for one explicit Brand Cloud
      description: The path cloud is reauthorized for this request and never inferred from active-org session state.
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Cloud-scoped fleet aggregates., content: { application/json: { schema: { $ref: "#/components/schemas/FleetSummary" } } } }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}/summary:
    parameters:
      - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getScopedBrandCloudSummary
      x-rtk-feature-id: FEAT-CA-PROV-001
      x-rtk-requirement-ids: [REQ-UI-CA-FLEETPAGE-001]
      tags: [Developer, Fleet]
      summary: Read the customer-safe dashboard summary for one explicit Brand Cloud
      description: This request revalidates path-cloud membership and does not read or update active-org session state.
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Cloud-scoped customer dashboard summary. }
        default: { $ref: '#/components/responses/ManagedCloudError' }

  /api/developer/brand-clouds/{brandCloudID}/fleet/devices:
    parameters:
      - { name: brandCloudID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listScopedBrandCloudFleetDevices
      x-rtk-feature-id: FEAT-CA-PROV-001
      x-rtk-requirement-ids: [REQ-UI-CA-FLEETPAGE-002]
      tags: [Developer, Fleet, Devices]
      summary: Search a bounded device page in one explicit Brand Cloud
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: region, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: readiness, in: query, schema: { type: string } }
        - { name: firmware, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
