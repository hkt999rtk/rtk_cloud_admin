<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式工廠簽發時序圖</title><style>body{margin:0;background:#f4f8fc;color:#213246;font-family:system-ui,sans-serif}main{max-width:1580px;margin:auto;padding:24px}h1{font-size:clamp(1.5rem,3vw,2.3rem);margin:0 0 8px}.note{background:#fff4e9;border-left:4px solid #c65726;padding:12px 16px;line-height:1.5}.diagram{overflow-x:auto;background:white;border:1px solid #cad7e5;border-radius:10px;padding:12px}svg{min-width:1560px;width:100%;height:auto}</style></head><body><main><h1>正式工廠簽發時序圖</h1><p class="note">這是經授權的量產流程。Cloud Test Lab 是簡化的開發測試流程，不可用於量產。</p><div class="diagram"><svg viewBox="0 0 1560 830" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="正式工廠簽發時序圖"><style>.actor{font:650 15px system-ui,sans-serif;fill:#213246}.step{font:13px system-ui,sans-serif;fill:#213246}.lifeline{stroke:#94a9bc;stroke-dasharray:5 5}.arrow{stroke:#c65726;stroke-width:2}</style><rect width="1560" height="830" fill="#fff"/><rect x="24" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="120" y="56" text-anchor="middle" class="actor">雲端管理者</text><line x1="120" y1="78" x2="120" y2="806" class="lifeline"/><rect x="244" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="340" y="56" text-anchor="middle" class="actor">平台管理員</text><line x1="340" y1="78" x2="340" y2="806" class="lifeline"/><rect x="464" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="560" y="56" text-anchor="middle" class="actor">工廠閘道</text><line x1="560" y1="78" x2="560" y2="806" class="lifeline"/><rect x="684" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="780" y="56" text-anchor="middle" class="actor">裝置</text><line x1="780" y1="78" x2="780" y2="806" class="lifeline"/><rect x="904" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="1000" y="56" text-anchor="mid
