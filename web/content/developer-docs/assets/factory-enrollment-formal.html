<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formal factory enrollment sequence</title><style>body{margin:0;background:#f4f8fc;color:#213246;font-family:system-ui,sans-serif}main{max-width:1580px;margin:auto;padding:24px}h1{font-size:clamp(1.5rem,3vw,2.3rem);margin:0 0 8px}.note{background:#fff4e9;border-left:4px solid #c65726;padding:12px 16px;line-height:1.5}.diagram{overflow-x:auto;background:white;border:1px solid #cad7e5;border-radius:10px;padding:12px}svg{min-width:1560px;width:100%;height:auto}</style></head><body><main><h1>Formal factory enrollment sequence</h1><p class="note">This is the authorized mass-production flow. Cloud Test Lab is a simplified development test and must not be used for mass production.</p><div class="diagram"><svg viewBox="0 0 1560 830" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Formal factory enrollment sequence"><style>.actor{font:650 15px system-ui,sans-serif;fill:#213246}.step{font:13px system-ui,sans-serif;fill:#213246}.lifeline{stroke:#94a9bc;stroke-dasharray:5 5}.arrow{stroke:#c65726;stroke-width:2}</style><rect width="1560" height="830" fill="#fff"/><rect x="24" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="120" y="56" text-anchor="middle" class="actor">Cloud owner</text><line x1="120" y1="78" x2="120" y2="806" class="lifeline"/><rect x="244" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="340" y="56" text-anchor="middle" class="actor">Platform operator</text><line x1="340" y1="78" x2="340" y2="806" class="lifeline"/><rect x="464" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="560" y="56" text-anchor="middle" class="actor">Factory gateway</text><line x1="560" y1="78" x2="560" y2="806" class="lifeline"/><rect x="684" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="780" y="56" text-anchor="middle" class="actor">Device</text><line x1="780" y1="78" x2="780" y2="806" class="lifeline"/><rect x="904" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="1000" y="56" text-anchor="middle" class="actor">Factory enrollment service</text><line x1="1000" y1="78" x2="1000" y2="806" class="lifeline"/><rect x="1124" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="1220" y="56" text-anchor="middle" class="actor">Account Manager</text><line x1="1220" y1="78" x2="1220" y2="806" class="lifeline"/><rect x="1344" y="24" width="192" height="54" rx="8" fill="#fff" stroke="#244c78"/><text x="1440" y="56" text-anchor="middle" class="actor">Product issuer</text><line x1="1440" y1="78" x2="1440" y2="806" class="lifeline"/><text x="450" y="115" text-anchor="middle" class="step">Submit factory CSR</text><line x1="560" y1="128" x2="351" y2="128" class="arrow"/><polygon points="340,128 352,122 352,134" fill="#c65726"/><text x="450" y="183" text-anchor="middle" class="step">Issue factory client certificate</text><line x1="340" y1="196" x2="549" y2="196" class="arrow"/><polygon points="560,196 548,190 548,202" fill="#c65726"/><text x="670" y="251" text-anchor="middle" class="step">Create Product production run</text><line x1="120" y1="264" x2="1209" y2="264" class="arrow"/><polygon points="1220,264 1208,258 1208,270" fill="#c65726"/><text x="340" y="319" text-anchor="middle" class="step">Deliver batch JWT securely (shown once)</text><line x1="120" y1="332" x2="549" y2="332" class="arrow"/><polygon points="560,332 548,326 548,338" fill="#c65726"/><text x="670" y="387" text-anchor="middle" class="step">Generate key locally; send device CSR</text><line x1="780" y1="400" x2="571" y2="400" class="arrow"/><polygon points="560,400 572,394 572,406" fill="#c65726"/><text x="780" y="455" text-anchor="middle" class="step">mTLS + JWT + device CSR</text><line x1="560" y1="468" x2="989" y2="468" class="arrow"/><polygon points="1000,468 988,462 988,474" fill="#c65726"/><text x="1110" y="523" text-anchor="middle" class="step">Check run, Cloud, Product and quota</text><line x1="1000" y1="536" x2="1209" y2="536" class="arrow"/><polygon points="1220,536 1208,530 1208,542" fill="#c65726"/><text x="1220" y="591" text-anchor="middle" class="step">Sign using this Product issuer</text><line x1="1000" y1="604" x2="1429" y2="604" class="arrow"/><polygon points="1440,604 1428,598 1428,610" fill="#c65726"/><text x="1000" y="659" text-anchor="middle" class="step">Return device certificate and chain</text><line x1="1440" y1="672" x2="571" y2="672" class="arrow"/><polygon points="560,672 572,666 572,678" fill="#c65726"/><text x="670" y="727" text-anchor="middle" class="step">Install certificate; retain device key</text><line x1="560" y1="740" x2="769" y2="740" class="arrow"/><polygon points="780,740 768,734 768,746" fill="#c65726"/></svg></div></main></body></html>
